[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-solver"
version = "1.0.0"
description = "LangGraph-based agent for solving Abstraction and Reasoning Corpus (ARC) challenges"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["arc", "abstraction", "reasoning", "langgraph", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.3.0",
    "google-cloud-storage>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=1.0.0",
    "langchain-google-vertexai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-ollama>=0.1.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "flask>=2.0.0",
    "gradio>=4.0.0",
]

[project.optional-dependencies]
local-llm = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.3",
    "bitsandbytes>=0.39.0",
    "llama-cpp-python>=0.1.51",
    "sentencepiece>=0.1.98",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
arc-baseline = "run_arc_baseline:main"
arc-langgraph = "run_langgraph_agent:main"
arc-visualizer = "arc_visualizer:main"

[tool.setuptools]
packages = ["agentic", "prompts", "utils"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.html"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
